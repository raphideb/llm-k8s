---
# Alternative deployment using hostPath directly (simpler, no PV/PVC needed)
# Use this if you have issues with PersistentVolumes
# IMPORTANT: Update nodeSelector hostname to match your actual GPU node

apiVersion: v1
kind: Namespace
metadata:
  name: llm-inference

---
# Deployment for Qwen2.5-Coder-14B (GPU-optimized for coding)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-coder-14b
  namespace: llm-inference
  labels:
    app: qwen-coder-14b
    model: qwen2.5-coder-14b-instruct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-coder-14b
  template:
    metadata:
      labels:
        app: qwen-coder-14b
    spec:
      nodeSelector:
        kubernetes.io/hostname: node-with-gpu  # CHANGE THIS to your actual node hostname
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server-cuda
        imagePullPolicy: Always
        command:
          - /llama-server
        args:
          - --model
          - /models/Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
          - --host
          - "0.0.0.0"
          - --port
          - "8080"
          - --n-gpu-layers
          - "48"
          - --ctx-size
          - "32768"
          - --n-batch
          - "2048"
          - --n-ubatch
          - "512"
          - --threads
          - "8"
          - --flash-attn
          - "1"
          - --metrics
          - --log-format
          - json
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            nvidia.com/gpu: 1
            memory: "16Gi"
            cpu: "4"
          limits:
            nvidia.com/gpu: 1
            memory: "24Gi"
            cpu: "8"
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: models
        hostPath:
          path: /home/raphi/git/models
          type: Directory

---
# Service for Qwen2.5-Coder-14B (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: qwen-coder-14b-service
  namespace: llm-inference
  labels:
    app: qwen-coder-14b
spec:
  type: NodePort
  selector:
    app: qwen-coder-14b
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
    name: http

---
# Deployment for Qwen2.5-14B-Instruct (Hybrid GPU/RAM for chat)
apiVersion: apps/v1
kind: Deployment
