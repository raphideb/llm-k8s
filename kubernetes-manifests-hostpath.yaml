            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: models
        hostPath:
          path: /home/raphi/git/models
          type: Directory

---
# Service for Qwen2.5-14B-Instruct (NodePort)
apiVersion: v1
kind: Service
metadata:
  name: qwen-chat-14b-service
  namespace: llm-inference
  labels:
    app: qwen-chat-14b
spec:
  type: NodePort
  selector:
    app: qwen-chat-14b
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30081
    protocol: TCP
    name: http
